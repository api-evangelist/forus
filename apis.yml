aid: forus
name: Forus
description: 'Forus (formerly Tandem) is an AI-powered healthcare technology company
  operating a network that connects physicians, pharmacies, payers, and biopharmaceutical
  companies to accelerate patient access to prescribed medicines. Its platform automates
  the administrative work between a clinical decision and treatment initiation: insurance
  prior authorization, AI-generated denial appeals, financial-assistance enrollment,
  benefit verification, and pharmacy fulfillment routing. Forus is embedded in physician
  workflows across most U.S. zip codes and is SOC 2 Type II and HIPAA compliant. It
  offers no public developer API, OpenAPI spec, or SDKs; this profile captures the
  company''s public web, trust, and security surface.'
